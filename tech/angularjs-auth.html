<!DOCTYPE html>
<html lang="en" ng-app="techLabAuth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decision Co-Pilot &mdash; Sign In</title>
    <link rel="stylesheet" href="/tech/assets/tech-lab.css" />
    <style>
      .login-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #fbf7f1 0%, #f2ece3 100%);
        padding: 2rem 1rem;
      }
      .login-card {
        width: min(440px, 100%);
        background: rgba(255, 252, 247, 0.96);
        border: 1px solid rgba(20, 37, 44, 0.1);
        border-radius: 28px;
        box-shadow: 0 18px 54px rgba(20, 37, 44, 0.08);
        padding: 2.2rem 2rem 1.8rem;
      }
      .login-card h1 {
        margin: 0 0 0.3rem;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 2.1rem;
        color: #15262c;
        line-height: 1.08;
      }
      .login-card .subtitle {
        color: #5f6d73;
        font-size: 0.92rem;
        margin: 0 0 1.6rem;
        line-height: 1.5;
      }
      .login-card .field-group { margin-bottom: 1rem; }
      .login-card .field-group label {
        font-size: 0.88rem;
        color: #5f6d73;
        margin-bottom: 0.3rem;
        display: block;
      }
      .login-card .field-group input {
        width: 100%;
        min-height: 46px;
        border: 1px solid rgba(20, 37, 44, 0.12);
        border-radius: 16px;
        padding: 0.7rem 0.9rem;
        font: inherit;
        font-size: 0.95rem;
        background: #fffdf9;
        transition: border-color 0.2s;
      }
      .login-card .field-group input:focus {
        outline: none;
        border-color: #0e6c67;
        box-shadow: 0 0 0 3px rgba(14, 108, 103, 0.08);
      }
      .login-card button {
        width: 100%;
        min-height: 48px;
        border-radius: 999px;
        border: none;
        background: #0e6c67;
        color: #fff9f2;
        font: inherit;
        font-weight: 600;
        font-size: 0.96rem;
        cursor: pointer;
        margin-top: 0.3rem;
        margin-bottom: 0.9rem;
        transition: background 0.2s, transform 0.15s;
      }
      .login-card button:hover { background: #0c5b57; transform: translateY(-1px); }
      .login-card .hint {
        text-align: center;
        font-size: 0.82rem;
        color: #7b898f;
        padding-top: 0.6rem;
        border-top: 1px solid rgba(20, 37, 44, 0.08);
      }
      .login-card .hint code {
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 0.9rem;
        background: rgba(20, 37, 44, 0.04);
        padding: 0.2rem 0.5rem;
        border-radius: 8px;
      }
      .login-badge {
        display: inline-flex;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        background: rgba(14, 108, 103, 0.1);
        color: #0e6c67;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 700;
        margin-bottom: 0.9rem;
      }
      .login-error {
        background: rgba(188, 74, 54, 0.08);
        color: #a13d2a;
        border-radius: 14px;
        padding: 0.7rem 0.9rem;
        font-size: 0.85rem;
        margin-bottom: 0.9rem;
      }
      [ng-cloak] { display: none !important; }
    </style>
  </head>
  <body ng-cloak>
    <div class="login-page" ng-controller="AuthController as auth">
      <div class="login-card">
        <div class="login-badge">Decision Co-Pilot</div>
        <h1>Sign in</h1>
        <p class="subtitle">Enter your credentials to access the insurance decision engine.</p>

        <div class="login-error" ng-if="auth.loginError">{{ auth.loginError }}</div>

        <form ng-submit="auth.submitLogin()">
          <div class="field-group">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" ng-model="auth.loginForm.email" placeholder="demo@decision.local" />
          </div>
          <div class="field-group">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" ng-model="auth.loginForm.password" placeholder="Enter password" />
          </div>
          <button type="submit">Sign in</button>
        </form>

        <div class="hint">
          Demo credentials &mdash; <code>demo@decision.local</code> / <code>Demo1234!</code>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="/tech/assets/tech-lab.js"></script>
    <script>
      (function () {
        var app = angular.module("techLabAuth", []);

        app.controller("AuthController", function () {
          var vm = this;
          vm.users = window.TechLab.createSeedUsers();
          vm.loginError = "";
          vm.loginForm = {
            email: "demo@decision.local",
            password: "Demo1234!",
          };

          vm.submitLogin = function () {
            vm.loginError = "";
            var result = window.TechLab.loginUser(vm.users, vm.loginForm);
            if (!result.ok) {
              vm.loginError = result.message;
              return;
            }
            window.location.href = "http://localhost:8501";
          };
        });
      })();
    </script>
  </body>
</html>
